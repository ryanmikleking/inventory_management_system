services:
  frontend:
    build:
      context: ./application
    container_name: inventory_frontend
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    container_name: inventory_server

    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432

    ports:
      - "3001:3001"

    env_file:
      - ./server/.env.development

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  minio:
    image: minio/minio
    container_name: inventory_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
      MINIO_SERVER_URL: "http://localhost:9000"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  postgres:
    image: postgres:17
    container_name: inventory-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
  postgres_data:
